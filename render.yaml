services:
  - type: web
    name: pharmaiq
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: uv run --no-sync streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
